<section id="clientes" hidden aria-labelledby="clientes-title">
  <header class="section-header">
    <h1 id="clientes-title" tabindex="-1">Clientes</h1>
    <div class="actions">
      <button id="export-csv" type="button" hidden>Exportar CSV</button>
      <button id="export-xlsx" type="button" hidden>Exportar Excel</button>
      <button class="primary" id="new-client" type="button" hidden>Novo cliente</button>
    </div>
  </header>
  <div class="panel">
    <form id="bairro-form" class="toolbar" role="search">
      <label for="bairro-search">Bairro
        <input id="bairro-search" name="bairro" type="search" maxlength="100" placeholder="Ex.: Asa Norte">
      </label>
      <label for="seller-filter">Vendedor
        <select id="seller-filter" name="vendedor" disabled>
          <option value="">Todos os vendedores</option>
        </select>
      </label>
      <button class="primary" type="submit">Buscar</button>
      <button id="clear-bairro" type="button">Limpar</button>
    </form>
    <p id="clients-status" class="table-status" role="status"></p>
    <button id="clients-retry" class="retry" type="button" hidden>Tentar novamente</button>
    <div class="table-scroll" role="region" aria-label="Tabela de clientes" tabindex="0">
      <table>
        <thead><tr><th scope="col">Identificador</th><th scope="col">Razão social</th><th scope="col">Bairro</th><th scope="col">Cidade</th><th scope="col">UF</th><th scope="col">Vendedor</th><th scope="col">Ações</th></tr></thead>
        <tbody id="client-rows"></tbody>
      </table>
    </div>
    <div class="pagination" role="group" aria-label="Paginação de clientes">
      <button id="previous-page" type="button" disabled>Anterior</button>
      <span id="page-label">Página 1</span>
      <button id="next-page" type="button" disabled>Próxima</button>
    </div>
  </div>
</section>
